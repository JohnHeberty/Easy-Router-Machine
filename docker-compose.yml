version: '3.8'

services:
  api-router-disbral:
    build: .
    image: cca2025devops/api-router-disbral:${API_ROUTER_VERSION}
    container_name: api-router-disbral-${API_ROUTER_VERSION}
    env_file:
      - .env
    ports:
      - "${API_PORT}:8010"
    volumes:
      - "${SQLITE_HOST_PATH}:${SQLITE_CONTAINER_PATH}"
    networks:
      - api-router-disbral
    restart: unless-stopped

networks:
  api-router-disbral:
    driver: bridge
